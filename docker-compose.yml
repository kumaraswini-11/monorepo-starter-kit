# Local development Postgres only. Production is self-hosted Postgres as the
# system-of-record (ADR 0019); this compose file is never used in prod.
services:
  postgres:
    image: postgres:17
    container_name: monorepo-starter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
