packages:
  - "apps/*"
  - "packages/*"

# Supply-chain hardening: delay installing just-published versions so a
# compromised release has time to be caught and pulled. This is pnpm 11's
# default (1 day = 1440 min); set explicitly here for pnpm 10.
# REMOVE after upgrading to pnpm 11, where it is on by default
# (see docs/future-improvements.md).
minimumReleaseAge: 1440

catalog:
  # React & framework
  react: 19.2.8
  react-dom: 19.2.8
  next: 16.2.10
  next-themes: ^0.4.6
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  # Shared libraries
  lucide-react: ^1.28.0
  # Language & lint tooling
  typescript: ^5.9.3
  eslint: ^9.39.5
  "@types/node": ^26.1.2
  # Tailwind
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3

allowBuilds:
  sharp: true
  unrs-resolver: true
  esbuild: true
  msw: false
