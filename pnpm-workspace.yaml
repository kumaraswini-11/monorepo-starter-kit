packages:
  - "apps/*"
  - "packages/*"

# ---------------------------------------------------------------------------
# pnpm settings (pnpm >= 11 reads only auth/registry settings from .npmrc; every
# other setting lives here). Keep this block the complete, explicit security
# posture of the repo — see docs/decisions/0033 and https://pnpm.io/supply-chain-security.
# ---------------------------------------------------------------------------

# Refuse to install when the running Node/pnpm don't satisfy `engines` (root and
# every package). Formerly `engine-strict=true` in .npmrc.
engineStrict: true

# Supply-chain hardening (pnpm 11 defaults, written explicitly so a derived repo
# on another pnpm line gets the same posture):
# - minimumReleaseAge: a just-published version must age 24h before it resolves,
#   so a compromised release has time to be caught and pulled (applies transitively).
#   pnpm 11 turns on minimumReleaseAgeStrict when this is set: resolution FAILS
#   instead of silently falling back to an older version.
minimumReleaseAge: 1440
# - strictDepBuilds: a dependency with a lifecycle script that is not listed in
#   `allowBuilds` fails the install instead of merely warning.
strictDepBuilds: true
# - blockExoticSubdeps: transitive deps may only come from the registry (no git/
#   tarball/URL sub-dependencies sneaking into the graph).
blockExoticSubdeps: true
# - trustPolicy: refuse a resolution that downgrades a package's provenance/trust
#   level versus what the lockfile already has.
trustPolicy: no-downgrade
# trustPolicyIgnoreAfter: the downgrade check only makes sense for RECENT releases
# (a takeover shows up as a fresh version that drops provenance). Versions older
# than 180 days (minutes) predate trusted publishing for many transitive packages
# (e.g. semver@6, chokidar@4) and are waived — the documented mechanism for this.
trustPolicyIgnoreAfter: 259200
# - verifyDepsBeforeRun: `pnpm run`/`exec` check node_modules matches the lockfile
#   and install first if not (no "works on my machine" from a stale install).
verifyDepsBeforeRun: install
# runtimeOnFail: pnpm downloads the Node version pinned in package.json devEngines.runtime
# and runs every script / exec with it; the exact version + checksum are recorded in the
# lockfile, so CI and every dev box run the same binary (no nvm/fnm needed). pnpm normalizes
# the manifest to onFail: download, a value npm does not understand — inside this repo use
# pnpm (and `pnpm dlx`), never npm/npx (the repo is pnpm-only anyway: engineStrict).
runtimeOnFail: download

# catalogMode: strict — every third-party dependency is declared ONCE, here, and referenced as
# `catalog:` from the workspace manifests (single-version policy: one bump site, no silent
# duplicate majors across packages). `pnpm add <pkg>` must target the catalog
# (`pnpm add --filter <pkg> --catalog`); an inline version in a manifest is an error.
catalogMode: strict

catalog:
  # React & framework (react + react-dom + next move together; @types/react tracks react)
  react: 19.2.8
  react-dom: 19.2.8
  next: 16.3.4
  next-themes: ^0.4.6
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  babel-plugin-react-compiler: ^1.0.0

  # Design system — shadcn/ui on Base UI (ADR 0021) and the primitives it vendors. `shadcn` is the
  # CLI used to pull components; never `--overwrite` (ADR 0030).
  "@base-ui/react": ^1.8.0
  lucide-react: ^1.41.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  cmdk: ^1.1.1
  input-otp: ^1.5.0
  embla-carousel-react: ^8.6.0
  react-day-picker: ^10.0.1
  react-resizable-panels: ^4.12.3
  recharts: 3.10.1
  date-fns: ^4.4.0
  tw-animate-css: ^1.4.0
  shadcn: ^4.21.0

  # Forms & validation — React Hook Form + zod (ADR 0022); shared by packages/ui and apps/web
  react-hook-form: ^7.87.0
  "@hookform/resolvers": ^5.9.1
  zod: ^4.5.4

  # Server, auth & data (ADR 0011/0012/0013). `server-only` is the build-time guard on server
  # modules; drizzle-kit/dotenv are the migration CLI's dev-time deps (packages/db).
  better-auth: ^1.7.3
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  pg: ^8.23.0
  "@types/pg": ^8.23.1
  dotenv: ^17.4.2
  ua-parser-js: ^2.0.10
  server-only: ^0.0.1
  "@t3-oss/env-core": ^0.13.11

  # Email — React Email + Nodemailer SMTP port (ADR 0014)
  react-email: ^6.9.3
  "@react-email/render": ^2.1.0
  "@react-email/ui": ^6.9.3
  nodemailer: ^10.0.0

  # Tailwind CSS v4 (postcss for Next, vite plugin for Storybook)
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/vite": ^4.3.3

  # Testing (ADR 0025). The @vitest/* family must track vitest's exact version; Playwright is
  # one release train split across the e2e runner (@playwright/test) and the browser driver used
  # by Storybook browser-mode tests (playwright). jest-dom v7 requires @testing-library/dom as
  # a non-optional peer, so it is pinned here and owned by @workspace/vitest-config.
  vitest: ^5.0.3
  "@vitest/coverage-v8": ^5.0.3
  "@vitest/browser-playwright": ^5.0.3
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  jsdom: ^30.0.1
  msw: ^2.15.0
  "@testcontainers/postgresql": ^12.2.0
  "@playwright/test": ^1.63.0
  playwright: ^1.63.0

  # Storybook (ADR 0024) — every @storybook/* package MUST move in lockstep (same version);
  # a Dependabot bump of one of them alone has caused skew before. `vite` is Storybook's
  # bundler (nextjs-vite framework).
  storybook: ^10.6.1
  "@storybook/nextjs-vite": ^10.6.1
  "@storybook/addon-a11y": ^10.6.1
  "@storybook/addon-docs": ^10.6.1
  "@storybook/addon-mcp": ^10.6.1
  "@storybook/addon-vitest": ^10.6.1
  eslint-plugin-storybook: ^10.6.1
  vite: ^8.2.2

  # Lint & format (ADR 0004/0005/0033). `typescript-eslint` is the meta-package (parser + plugin).
  # `@eslint-react` replaces eslint-plugin-react (no ESLint 10 support upstream). Prettier
  # plugins: sort-imports first, tailwindcss LAST.
  eslint: ^10.12.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.71.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-jsx-a11y: ^6.10.2
  "@eslint-react/eslint-plugin": ^5.24.0
  eslint-plugin-react-hooks: ^7.1.1
  "@next/eslint-plugin-next": ^16.3.4
  eslint-plugin-turbo: ^2.11.7
  globals: ^17.12.0
  prettier: ^3.9.9
  "@ianvs/prettier-plugin-sort-imports": ^4.7.1
  prettier-plugin-tailwindcss: ^0.8.1

  # Toolchain. Turborepo's three packages (turbo, @turbo/gen, eslint-plugin-turbo) are one release
  # and stay in lockstep. @types/node tracks the Node line we run (24) — bump with the runtime.
  typescript: ^6.0.3
  "@types/node": ^24.13.3
  turbo: ^2.11.7
  "@turbo/gen": ^2.11.7
  taze: ^21.3.0

# Build-script allow/deny list (strictDepBuilds makes an unlisted script a hard
# error). true = the package genuinely needs its native/postinstall step;
# false = reviewed and not needed (optional native addons fall back to JS,
# notice-only postinstalls are noise).
allowBuilds:
  sharp: true # next/image optimizer (native)
  esbuild: true # downloads its platform binary
  msw: false # postinstall only prints a message
  cpu-features: false # optional native addon for ssh2 (testcontainers); JS fallback
  ssh2: false # testcontainers transitive; its install step only tries cpu-features
  protobufjs: false # testcontainers transitive; postinstall is a notice script

# Peer ranges we have verified to be stale rather than real incompatibilities. Each entry keeps
# the install log free of a known-benign warning so a NEW warning is a real signal; remove an entry
# when the upstream peer range catches up (the trigger is named per line).
peerDependencyRules:
  allowedVersions:
    # jsx-a11y rules run on ESLint 10 (lint gate green); upstream issue jsx-eslint/eslint-plugin-jsx-a11y#1075.
    "eslint-plugin-jsx-a11y>eslint": "10"
    # better-auth's optional vitest peer (its testUtils) only declares ^2-^4; verified on 5 in the
    # auth integration suite. Remove when better-auth declares ^5.
    "better-auth>vitest": "5"
    # tsconfck only parses tsconfig JSON; its ^5 peer predates TS 6. Remove when it declares ^6.
    "tsconfck>typescript": "6"

# Security patches for transitive deps flagged by `pnpm audit --prod`. None are exploitable in
# the shipped app (dev/CLI tooling or unreachable resolver branches — we use the zod resolver,
# not ajv/valibot), but they're pinned to the fixed versions so the audit stays a clean signal.
# Version selectors (`pkg@<x`) bump only the vulnerable range, leaving unrelated majors alone.
overrides:
  "fast-uri@<3.1.5": "^3.1.5" # GHSA-v2hh-gcrm-f6hx / GHSA-7p8r-x3mc-p8w7 (host confusion)
  "valibot@<1.4.2": "^1.4.2" # GHSA-5qjj-4xww-7phc (flatten throws on inherited keys)
  "esbuild@<0.25.0": "^0.25.0" # GHSA-67mh-4wv8-2f99 (dev-server request; via drizzle-kit CLI)
  "nanoid@<3.3.18": "^3.3.18" # GHSA-2v37-7h3g-55p8 (infinite loop on size 0)
