name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  ci:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # @workspace/env validates at import, which runs during `next build`. CI has no
      # secrets, so skip validation here — real runtimes still fail-fast at startup
      # (ADR 0013). lint/typecheck don't execute the module, so job-level is safe.
      SKIP_ENV_VALIDATION: "1"
      # Uncomment to enable Turborepo Remote Caching (Vercel):
      # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      # TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        # Third-party actions are pinned to a full commit SHA (supply-chain
        # hardening); the trailing comment tracks the human-readable version,
        # and Dependabot (.github/dependabot.yml) keeps both current.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, so don't leave the token in .git/config.
          persist-credentials: false
          # fetch-depth: 2 lets Turborepo compare against the previous commit
          # (useful later for --filter=[HEAD^1] affected-package runs).
          fetch-depth: 2

      - name: Install pnpm
        # Reads the pinned pnpm version from the "packageManager" field.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Single source of truth for the Node version — .nvmrc (Node 24 LTS).
          # Keeps CI, local dev (nvm), and engines from drifting apart.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Lint, typecheck, build
        run: pnpm exec turbo run lint typecheck build

      - name: Security audit (production dependencies)
        # Report-only: surfaces known advisories without failing CI on transitive
        # vulnerabilities you cannot immediately fix. Review the run log.
        run: pnpm audit --prod
        continue-on-error: true

  test:
    name: Test (unit + component)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Some component tests may transitively pull @workspace/env; CI has no secrets, so
      # skip validation (real runtimes still fail-fast — ADR 0013).
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit + component tests (coverage, report-only)
        # Storybook's browser-mode tests are excluded here — they need Playwright browser
        # binaries and belong with the visual/e2e CI lane (ADR 0024/0029). Coverage is
        # report-only for now; thresholds come later (ADR 0025).
        run: pnpm exec turbo run test --filter='!storybook' -- --coverage

  integration:
    name: Test (integration — real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests (Testcontainers → real Postgres)
        # Testcontainers manages an ephemeral postgres:17; the Docker daemon on ubuntu-latest
        # runners is available out of the box, so no `services:` container is needed. The test
        # env (DATABASE_URL from the container + throwaway secret) is set by the shared harness
        # (@workspace/db/testing), so no CI secrets are required. (ADR 0025 §11)
        run: pnpm exec turbo run test:integration

  e2e:
    name: Test (e2e — Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `turbo test:e2e` builds apps/web first (dependsOn ^build); CI has no secrets, so skip
      # env validation for that build (ADR 0013). The e2e server gets throwaway env from
      # playwright.config; the DB-backed journeys (sign-up) run against the service below. (ADR 0025)
      SKIP_ENV_VALIDATION: "1"
      # global-setup migrates this and the app writes user/account/session to it; the schema is
      # dropped + recreated each run, so a throwaway service DB is exactly right. (ADR 0025)
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/app
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        # Gate the job's steps on the DB being ready to accept connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium)
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm exec turbo run test:e2e

      # Upload the Playwright report + traces/screenshots/videos so a CI failure is debuggable
      # beyond the inline annotations (config captures trace on-first-retry, media on failure).
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
