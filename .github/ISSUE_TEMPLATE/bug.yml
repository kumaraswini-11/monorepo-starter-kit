name: Bug report
description: Something does not behave as documented or expected.
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Do not file it here. Follow [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead? Include error output in a code block.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal, numbered sequence. A failing test or branch is ideal.
      placeholder: |
        1. pnpm install
        2. pnpm dev
        3. open /auth and ...
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Affected workspace(s)
      description: e.g. apps/web, packages/auth, CI
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser (if relevant), and the commit or version.
      placeholder: Windows 11 / Chrome 130 / main@abc1234
  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I ran `pnpm install` and the full gate (`pnpm format && pnpm lint && pnpm typecheck && pnpm build`) on a clean checkout.
          required: true
