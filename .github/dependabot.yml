version: 2

# Noise + supply-chain policy:
# - GROUP minor/patch bumps into a single PR per ecosystem (less churn); MAJOR
#   bumps stay ungrouped so each gets its own PR and individual review.
# - COOLDOWN lets just-published versions age before a PR is even opened — the
#   same "give a compromised release time to be caught and pulled" rationale as
#   pnpm `minimumReleaseAge` (pnpm-workspace.yaml); majors wait the longest.
updates:
  # Keep the SHA-pinned GitHub Actions current (and patch action advisories).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep npm/pnpm dependencies current — low-noise (quarterly + grouped).
  # Dependabot now reads pnpm `catalog:` entries (pnpm-workspace.yaml), so it also
  # proposes catalog deps; `taze` (`pnpm deps:check`) still handles routine catalog
  # refreshes. `quarterly` = every 3 months (GitHub Dependabot options reference;
  # GitHub Enterprise Server needs 3.19+). Majors for the deliberately-deferred
  # tooling are IGNORED below (ADR 0006) so they stop reopening — adopt those
  # manually when the ecosystem is ready.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 / ESLint 10 — deferred until typescript-eslint / the ESLint
      # plugin ecosystem support them (ADR 0006 / future-improvements.md).
      # `@eslint/js` moves with eslint's major, not ahead of it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # `@types/node` tracks the Node LTS we run (24); don't jump to Current (26+).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
